<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rhythmia Heart Care | The only heart supplement created by cardiologists</title>

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Welcome to the official website of Rhythmia Heart Care, the ultimate formulation to support heart rhythm health and tackle arrhythmias naturally." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.rhythmiaheartcare.com/" />
  <meta property="og:title" content="Rhythmia Heart Care | The only heart supplement created by cardiologists" />
  <meta property="og:description"
    content="Welcome to the official website of Rhythmia Heart Care, the ultimate formulation to support heart rhythm health and tackle arrhythmias naturally." />
  <meta property="og:image"
    content="https://www.rhythmiaheartcare.com/assets/logo/Rhythmia_Care_Logo_Workmark_Red_Heart_White_Copy_RGB.svg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://www.rhythmiaheartcare.com/" />
  <meta property="twitter:title" content="Rhythmia Heart Care | The only heart supplement created by cardiologists" />
  <meta property="twitter:description"
    content="Welcome to the official website of Rhythmia Heart Care, the ultimate formulation to support heart rhythm health and tackle arrhythmias naturally." />
  <meta property="twitter:image"
    content="https://www.rhythmiaheartcare.com/assets/logo/Rhythmia_Care_Logo_Workmark_Red_Heart_White_Copy_RGB.svg" />

  <!-- Schema Markup for Google Knowledge Panel -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HealthAndBeautyBusiness",
        "name": "Rhythmia Heart Care",
        "image": "https://www.rhythmiaheartcare.com/assets/logo/Rhythmia_Care_Logo_Workmark_Red_Heart_White_Copy_RGB.svg",
        "@id": "https://www.rhythmiaheartcare.com",
        "url": "https://www.rhythmiaheartcare.com",
        "description": "Rhythmia Heart Care is the ultimate formulation to support heart rhythm health and tackle arrhythmias naturally.",
        "telephone": "+44 7894 883492",
        "priceRange": "££",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "71-75 Shelton Street, Covent Garden",
          "addressLocality": "London",
          "postalCode": "WC2H 9JQ",
          "addressCountry": "UK"
        },
        "sameAs": [
          "https://www.instagram.com/rhythmiaheartcare",
          "https://www.facebook.com/rhythmiaheartcare"
        ]
      }
    </script>

  <!-- Typography: Clash Display for headings, Satoshi for text.
       Requested as two separate links because Fontshare's combined-family
       endpoint substitutes the wrong family for Satoshi. -->
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">

  <!-- Hero banner is the LCP element — start fetching it before React mounts.
       One preload per device, matching the <picture> breakpoint in Header.jsx,
       so a phone never downloads the desktop image or vice versa. -->
  <link rel="preload" as="image" href="/assets/photos/hero-banner.jpg" media="(min-width: 901px)" fetchpriority="high" />
  <link rel="preload" as="image" href="/assets/photos/hero-banner-mobile.jpg" media="(max-width: 900px)" fetchpriority="high" />

  <meta name="theme-color" content="#FBF9F7" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
